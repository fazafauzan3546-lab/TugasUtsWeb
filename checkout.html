<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Halaman Pemesanan / Checkout</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Checkout Pemesanan</h1>
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="stok.html">Katalog Stok</a>
            <a href="checkout.html">Pemesanan</a>
            <a href="tracking.html">Tracking</a>
        </nav>
    </header>
    <div class="container">
        <h2>Formulir Pemesanan Barang</h2>
        <form id="formCheckout">
            <div class="form-group">
                <label>Nama Pemesan</label>
                <input type="text" id="namaPemesan" required placeholder="Masukkan Nama Lengkap">
            </div>
            <div class="form-group">
                <label>Pilih Buku Katalog</label>
                <select id="pilihBuku">
                    <!-- Diisi dinamis via script.js -->
                </select>
            </div>
            <div class="form-group">
                <label>Jumlah Pesan</label>
                <input type="number" id="jumlahPesan" min="1" value="1" required>
            </div>
            <button type="submit">Proses Pesanan</button>
        </form>
        <div id="hasilCheckout" style="margin-top: 20px; font-weight: bold;"></div>
    </div>
    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
