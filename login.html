<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Login - Toko Buku Online</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container" style="max-width: 400px; margin-top: 100px;">
        <h2>Login Toko Buku</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required placeholder="rina@gmail.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="rina123">
            </div>
            <button type="submit">Login</button>
        </form>
        <p style="margin-top: 15px; text-align: center;">
            <a href="#" onclick="showModal('modalLupa')">Lupa Password?</a> | 
            <a href="#" onclick="showModal('modalDaftar')">Daftar</a>
        </p>
    </div>

    <!-- Modal Lupa Password -->
    <div id="modalLupa" class="modal">
        <div class="modal-content">
            <h3>Lupa Password</h3>
            <p>Silakan hubungi administrator (Siti Marlina) untuk mereset akun Anda.</p>
            <button class="close-btn" onclick="closeModal('modalLupa')">Tutup</button>
        </div>
    </div>

    <!-- Modal Daftar -->
    <div id="modalDaftar" class="modal">
        <div class="modal-content">
            <h3>Pendaftaran Akun</h3>
            <p>Pendaftaran akun baru saat ini ditutup.</p>
            <button class="close-btn" onclick="closeModal('modalDaftar')">Tutup</button>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
